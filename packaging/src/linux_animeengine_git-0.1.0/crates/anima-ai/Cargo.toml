[package]
name = "anima-ai"
description = "AI background removal: one ONNX model, one session, and the same preprocessing rembg uses."
version.workspace = true
edition.workspace = true
license.workspace = true
# Set by `ort`, which is not optional here. The engine crate used to inherit this floor; it no longer does.
rust-version = "1.92"

[dependencies]
image = { workspace = true, features = ["png"] }
md-5 = "0.11.0"
ort = "2.0.0-rc.15"
ureq = "3.5.1"

[dev-dependencies]
tempfile.workspace = true

# AnimaEngine as a Flatpak.
#
# The binaries are built outside the sandbox (`cargo build --release --features
# overlay,bc7`) and installed here; see README.md for the two commands that are
# needed on this machine (`flatpak-builder` and `org.freedesktop.Sdk//26.08` are
# not installed, so this manifest has not been built yet).
id: io.github.swordreforge.AnimaEngine
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: anima-overlay

finish-args:
  # Layer-shell surface + wgpu rendering.
  - --socket=wayland
  - --device=dri
  # ksni registers a StatusNotifierItem on the session bus.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Workshop downloads stay on the host (`anima-workshop download`), so the
  # sandbox only needs read access: the Steam client's items, our own SteamCMD
  # download root, and the animation files. No network is granted on purpose —
  # SteamCMD cannot run in the sandbox anyway; add `--share=network` with
  # `flatpak override` if you ever want `web`/`download` inside.
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=~/.steam:ro
  - --filesystem=~/.local/share/AnimaEngine:ro
  # Animations live anywhere in $HOME; narrow this (e.g. ~/Pictures:ro) if you
  # prefer, then pass paths explicitly.
  - --filesystem=home:ro

modules:
  - name: anima-engine
    buildsystem: simple
    build-commands:
      - install -Dm755 target/release/anima-overlay /app/bin/anima-overlay
      - install -Dm755 target/release/anima-overlay-ctl /app/bin/anima-overlay-ctl
      - install -Dm755 target/release/anima-workshop /app/bin/anima-workshop
      - install -Dm755 target/release/anima-i18n /app/bin/anima-i18n
      - install -Dm644 packaging/anima-engine-overlay.desktop /app/share/applications/anima-engine-overlay.desktop
      - install -Dm644 packaging/anima-engine-workshop.desktop /app/share/applications/anima-engine-workshop.desktop
      - install -Dm644 packaging/anima-engine.svg /app/share/icons/hicolor/scalable/apps/anima-engine.svg
      - install -Dm644 packaging/io.github.swordreforge.AnimaEngine.metainfo.xml /app/share/metainfo/io.github.swordreforge.AnimaEngine.metainfo.xml
    sources:
      - type: dir
        path: ../..
